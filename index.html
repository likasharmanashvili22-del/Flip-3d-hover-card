<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title> Flip Hover Card</title>
</head>
<body>
    <h1>Three hover cards</h1>
    <p>The most-used hover effects in pure CSS. Hover, or tab to a card on touch screens.</p>
<div class="card-container">
    <div class="card">
        <div class="front">
         <i class="fa-solid fa-rocket"></i>
         <p>Hover to turn it over</p>
        </div>
        <div class="back">
          <p>The card rotates 180° on the Y axis, and the front hides itself as it turns away.</p>
          <button>read more</button>
        </div>
    </div>
</div>
</body>
</html>
